<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dehnen</title>
  <meta name="description" content="Kurzes Dehnprogramm für Rücken und Beweglichkeit – ca. 10 Minuten, dreimal pro Woche.">
  <meta name="theme-color" content="#0a66b5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dehnen">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="main">
    <section id="view-home" class="view" aria-label="Start"></section>
    <section id="view-plans" class="view" aria-label="Programme" hidden></section>
    <section id="view-library" class="view" aria-label="Bibliothek" hidden></section>
    <section id="view-settings" class="view" aria-label="Einstellungen" hidden></section>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="Navigation"></nav>

  <!-- Training -->
  <section id="training" class="training work" hidden aria-label="Training">
    <div class="t-bg"><i class="bg-layer l-work"></i><i class="bg-layer l-rest"></i><i class="bg-layer l-prep"></i></div>
    <header class="t-top">
      <button id="t-stop" class="t-btn" type="button"></button>
      <div class="t-meta"><b id="t-counter"></b><span id="t-remaining"></span></div>
      <button id="t-info" class="t-btn" type="button"></button>
    </header>
    <div class="t-bar" aria-hidden="true"><i id="t-bar-fill"></i></div>

    <div class="t-hero">
      <div id="t-card" class="t-card">
        <img id="t-img" alt="" draggable="false">
        <div id="t-ph" class="t-ph" hidden></div>
      </div>
    </div>
    <div class="t-title"><small id="t-kicker"></small><h2 id="t-name"></h2></div>

    <div class="t-timer">
      <div id="circle" class="circle">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity=".72"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="150" cy="150" r="136"/>
          <circle id="ring" class="ring" cx="150" cy="150" r="136" transform="rotate(-90 150 150)"/>
        </svg>
        <div class="circle-inner">
          <div id="t-phase" class="t-phase"></div>
          <div id="t-time" class="t-time" role="timer">0</div>
        </div>
      </div>
    </div>

    <div id="t-next" class="t-next"></div>

    <div class="t-controls">
      <button id="t-prev" class="t-ctl" type="button"></button>
      <button id="t-toggle" class="t-ctl main" type="button"></button>
      <button id="t-skip" class="t-ctl" type="button"></button>
    </div>
  </section>

  <!-- Geschafft -->
  <section id="done" class="finish" hidden aria-label="Done">
    <div class="t-bg"><i class="bg-layer l-work" style="opacity:1"></i><i class="blob b1"></i><i class="blob b2"></i></div>
    <div class="done-box">
      <div id="done-icon" class="done-icon"></div>
      <h1 data-i18n="done.title"></h1>
      <p id="done-text"></p>
      <div id="done-week" class="done-week"></div>
      <button id="done-close" class="btn light big" type="button" data-i18n="done.close"></button>
    </div>
  </section>

  <canvas id="confetti" class="confetti"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
